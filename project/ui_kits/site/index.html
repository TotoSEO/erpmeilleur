<!-- @startingPoint section="Site" subtitle="Blog éditorial crm-logiciel.fr (4 écrans cliquables)" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crm-logiciel.fr — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; min-height: 100vh; }
  main { padding-bottom: 32px; }
  @media (min-width: 1000px) {
    .dk-nav { display: flex !important; }
    .dk-meta { display: inline !important; }
    .mb-burger { display: none !important; }
  }
</style>
</head>
<body class="lumiere">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>

<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="ArticleScreen.jsx"></script>
<script type="text/babel" src="FicheAvisScreen.jsx"></script>
<script type="text/babel" src="ComparatifScreen.jsx"></script>
<script type="text/babel" src="AuteurScreen.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function App() {
  const [screen, setScreen] = useState(() => {
    try { return localStorage.getItem('crmlog-screen') || 'article'; } catch (e) { return 'article'; }
  });
  const nav = (id) => {
    setScreen(id);
    try { localStorage.setItem('crmlog-screen', id); } catch (e) {}
    window.scrollTo({ top: 0 });
  };

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const Screen = {
    article: window.ArticleScreen,
    fiche: window.FicheAvisScreen,
    comparatif: window.ComparatifScreen,
    auteur: window.AuteurScreen,
  }[screen] || window.ArticleScreen;

  return (
    <div>
      <SiteHeader current={screen} onNav={nav} />
      <main><Screen onNav={nav} /></main>
      <SiteFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
