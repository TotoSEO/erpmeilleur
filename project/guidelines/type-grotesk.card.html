<!-- @dsCard group="Type" viewport="700x170" name="UI & corps — Hanken Grotesk" subtitle="Interface, labels, lecture — sans sobre et lisible" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--paper); font-family: var(--font-sans);
    background-image: radial-gradient(30rem 30rem at 100% 0%, rgba(79,176,42,.14), transparent 55%); }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-55); }
  .big { font-weight: 800; font-size: 30px; color: var(--ink); letter-spacing: -0.01em; margin-top: 6px; }
  .row { display: flex; gap: 26px; margin-top: 12px; align-items: baseline; flex-wrap: wrap; }
  .w b { display: block; font-size: 18px; color: var(--ink); }
  .w span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-55); }
</style>
</head>
<body>
  <div class="lab">Hanken Grotesk · sans</div>
  <div class="big">Comparatif · Verdict · Lecture</div>
  <div class="row">
    <div class="w"><b style="font-weight:400">Regular</b><span>400</span></div>
    <div class="w"><b style="font-weight:500">Medium</b><span>500</span></div>
    <div class="w"><b style="font-weight:600">Semibold</b><span>600</span></div>
    <div class="w"><b style="font-weight:700">Bold</b><span>700</span></div>
    <div class="w"><b style="font-weight:800">Black</b><span>800</span></div>
  </div>
</body>
</html>
