<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--paper); }
  .h { font-family: var(--font-grotesk); color: var(--ink); font-weight: 700; font-size: 40px; line-height: 1.02; letter-spacing: -0.02em; }
  .p { font-family: var(--font-sans); color: var(--ink-80); font-size: 17px; line-height: 1.55; max-width: 58ch; margin-top: 10px; }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-55); }
</style>
</head>
<body>
  <div class="lab">Bricolage Grotesque · 800</div>
  <div class="h">Le verdict en <span class="text-gradient">deux lignes</span></div>
  <div class="p">Titres en Bricolage Grotesque : moderne, géométrique, juste assez de caractère. L'option <code>.text-gradient</code> applique le dégradé iris sur le texte des héros.</div>
</body>
</html>
