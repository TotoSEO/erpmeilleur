<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--paper); font-family: var(--font-ui); }
  .item { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .item:last-child { border: 0; }
  .k { font-family: var(--font-mono); font-size: 12px; color: var(--ink-55); width: 130px; flex: none; }
  .v { color: var(--ink); }
  .v b { color: var(--blue); }
  .num { font-family: var(--font-mono); font-weight: 600; }
</style>
</head>
<body>
  <div class="item"><span class="k">Fraîcheur</span><span class="v">Mis à jour le <span class="num">12 juin 2026</span></span></div>
  <div class="item"><span class="k">Échantillon</span><span class="v"><span class="num">37</span> outils testés : verdicts signés</span></div>
  <div class="item"><span class="k">Lecture</span><span class="v"><span class="num">11</span> min de lecture</span></div>
  <div class="item"><span class="k">Ton</span><span class="v">Direct, chiffré, vouvoiement <b>:</b> aucune promesse</span></div>
</body>
</html>
