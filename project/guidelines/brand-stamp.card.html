<!-- @dsCard group="Brand" viewport="700x200" name="Disques de chiffres" subtitle="Pastilles dégradées flottantes — le relief des chiffres clés" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; height: 200px; background: var(--paper); overflow: hidden;
    background-image: radial-gradient(34rem 34rem at 0% 0%, rgba(46,46,255,.12), transparent 55%), radial-gradient(30rem 30rem at 100% 100%, rgba(255,212,0,.14), transparent 55%); }
  .stack { position: relative; height: 200px; max-width: 420px; margin: 0 auto; }
  .disc { position: absolute; border-radius: 0; clip-path: var(--cut-corner); display: grid; place-items: center; text-align: center; border: 1px solid rgba(255,255,255,.55); box-shadow: var(--shadow-disc), inset 0 1px 0 rgba(255,255,255,.7); }
  .v { font-family: var(--font-mono); font-weight: 700; font-size: 30px; color: #fff; line-height: 1; }
  .v small { font-size: 15px; opacity: .85; } .l { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.92); margin-top: 5px; }
  .d1 { width: 132px; height: 132px; left: 30px; top: 34px; background: linear-gradient(150deg,#2E2EFF,#18A6F6); transform: rotate(-6deg); z-index: 3; }
  .d2 { width: 110px; height: 110px; right: 96px; top: 16px; background: linear-gradient(150deg,#18A6F6,#2E2EFF); transform: rotate(5deg); z-index: 2; }
  .d3 { width: 100px; height: 100px; right: 24px; bottom: 14px; background: linear-gradient(150deg,#FFD400,#FFA800); transform: rotate(-3deg); z-index: 1; }
</style>
</head>
<body>
  <div class="stack">
    <div class="disc d1"><div><div class="v">8,4<small>/10</small></div><div class="l">global</div></div></div>
    <div class="disc d2"><div><div class="v">14,90<small>€</small></div><div class="l">/ mois</div></div></div>
    <div class="disc d3"><div><div class="v">14<small>j</small></div><div class="l">essai</div></div></div>
  </div>
</body>
</html>
