<!-- @dsCard group="Type" viewport="700x200" name="Mono data — JetBrains Mono" subtitle="LA signature : tout chiffre mesuré en mono tabulaire" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--data-white); }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-55); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--hairline); }
  th:first-child, td:first-child { text-align: left; font-family: var(--font-grotesk); font-weight: 600; color: var(--ink); }
  th { font-family: var(--font-grotesk); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-55); font-weight: 600; }
  td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums lining-nums; color: var(--ink); font-size: 15px; }
</style>
</head>
<body>
  <div class="lab">JetBrains Mono · tabular-nums</div>
  <table>
    <tr><th>Outil</th><th>Prix /mois</th><th>Plafond</th><th>Note</th></tr>
    <tr><td>Pipedrive</td><td class="num">14,90 €</td><td class="num">3 000</td><td class="num">8,4</td></tr>
    <tr><td>HubSpot</td><td class="num">0,00 €</td><td class="num">1 000 000</td><td class="num">7,1</td></tr>
    <tr><td>Axonaut</td><td class="num">41,99 €</td><td class="num">∞</td><td class="num">7,8</td></tr>
  </table>
</body>
</html>
