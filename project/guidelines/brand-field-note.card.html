<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper);
    background-image: radial-gradient(34rem 34rem at 0% 0%, rgba(79,176,42,.20), transparent 55%), radial-gradient(30rem 30rem at 100% 100%, rgba(14,159,90,.18), transparent 55%); }
  .callout { position: relative; border-radius: 30px; padding: 24px 28px 22px 88px; max-width: 560px;
    background: var(--glass-bg); 
    border: 2px solid var(--ink); box-shadow: var(--shadow-soft); }
  .orb { position: absolute; left: 24px; top: 24px; width: 48px; height: 48px; border-radius: 0; clip-path: var(--cut-tri-up); display: grid; place-items: center;
    background: var(--grad-aqua); box-shadow: 0 12px 22px -8px rgba(46,46,255,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .lab { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal-ink); font-weight: 600; }
  .tx { font-family: var(--font-sans); font-size: 15.5px; line-height: 1.6; color: var(--ink); margin-top: 5px; }
  .tx b { color: var(--ink); }
</style>
</head>
<body>
  <div class="callout">
    <div class="orb"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg></div>
    <div class="lab">Astuce</div>
    <div class="tx">Importez d'abord <b>50 contacts test</b> avant de migrer tout votre fichier : vous repérez les champs mal mappés en 5 minutes.</div>
  </div>
</body>
</html>
